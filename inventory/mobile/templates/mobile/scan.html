{% extends 'mobile/base.html' %}
{% block title %}Scannen{% endblock %}
{% block page_name %}scan{% endblock %}
{% block content %}
<header class="app-header">
  <h1>Scannen</h1>
</header>

<section class="section">
  <div class="card scanner-landing">
    <div class="card-icon" aria-hidden="true">[SCAN]</div>
    <h2 class="card-title">QR / Barcode scannen</h2>
    <p class="card-subtitle">Kamera-Unterstützung kann hier angebunden werden. Du kannst den Code auch manuell eingeben.</p>
    <form method="get" action="{% url 'mobile-scan-barcode' %}">
      <div class="input-group">
        <label for="manual-code">Code</label>
        <div class="search-bar"><input id="manual-code" class="search-input" name="code" placeholder="Code manuell eingeben" autocomplete="off" inputmode="text"></div>
      </div>
      <button class="btn btn-primary" type="submit">Code suchen</button>
    </form>
  </div>
</section>

<section class="section">
  <a class="btn btn-secondary" href="{% url 'mobile-barcode-list' %}">Barcode-Liste</a>
</section>
{% endblock %}
