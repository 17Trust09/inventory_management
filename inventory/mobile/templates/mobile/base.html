{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Inventarverwaltung{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'mobile/mobile.css' %}?v=1">
  {% block extra_css %}{% endblock %}
</head>
<body class="mobile-body" data-page="{% block page_name %}{% endblock %}">
  <main class="mobile-safe-container">
    {% block content %}{% endblock %}
  </main>

  {% block bottom_nav %}
  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a class="nav-item" href="{% url 'index' %}" data-nav="home"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Home</span></a>
    <a class="nav-item" href="{% url 'dashboards' %}" data-nav="dashboards"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Boards</span></a>
    <a class="nav-item" href="{% url 'add-equipment' %}" data-nav="add"><span class="nav-icon" aria-hidden="true">＋</span><span class="nav-label">Neu</span></a>
    <a class="nav-item" href="{% url 'scan-barcode' %}" data-nav="scan"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-label">Scan</span></a>
    <a class="nav-item" href="{% url 'feedback-list' %}" data-nav="feedback"><span class="nav-icon" aria-hidden="true">◌</span><span class="nav-label">Feedback</span></a>
  </nav>
  {% endblock %}

  <div class="pull-to-refresh-indicator" aria-hidden="true"></div>
  <script src="{% static 'mobile/mobile.js' %}?v=1" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
